plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
    id 'java'
}

version = project.mod_version
group = project.mod_group

repositories {
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://maven.impactdev.net/repository/development/" }
    maven { url "https://maven.nucleoid.xyz" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Cobblemon API
    modCompileOnly "com.cobblemon:fabric:${cobblemon_version}"

    // SGUI for pure server-side inventory interfaces
    modImplementation include("eu.pb4:sgui:1.6.1+1.21.1")

    // Database connection pooling & JDBC drivers
    implementation "com.zaxxer:HikariCP:5.1.0"
    include "com.zaxxer:HikariCP:5.1.0"
    implementation "org.mariadb.jdbc:mariadb-java-client:3.3.3"
    include "org.mariadb.jdbc:mariadb-java-client:3.3.3"
    implementation "com.mysql:mysql-connector-j:8.3.0"
    include "com.mysql:mysql-connector-j:8.3.0"

    // Impactor economy API
    compileOnly files("libs/impactor-api-5.3.5-slim.jar", "libs/event-api-5.0.0-SNAPSHOT.jar")
    compileOnly "net.kyori:adventure-api:4.17.0"
    compileOnly "net.kyori:adventure-key:4.17.0"

    // Kotlin stdlib for Cobblemon event callbacks
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
    testImplementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"

    // Gson is provided by Minecraft at runtime
    compileOnly "com.google.code.gson:gson:2.10.1"

    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "com.google.code.gson:gson:2.10.1"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
